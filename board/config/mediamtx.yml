###############################################
# mediamtx 配置 — 小车图传 (v1.11.3)
#
# 为什么这么短:
#   上游的完整模板 (878 行) 针对更新的版本, 含 v1.11.3 **不认识**的字段
#   (例如 apiAllowOrigins)。直接用它启动会报
#       ERR: json: unknown field "apiAllowOrigins"
#   然后进程退出 —— 表现为"mediamtx 起不来", 但日志只有一行 JSON 错误,
#   很容易以为是别的问题。
#
#   所以这里只写真正需要的项, 其余全部走内置默认值。
###############################################

logLevel: info
logDestinations: [stdout]
# 扛隧道突发 (默认 512 在 ICE-TCP+突发下溢出, 表现为周期性卡顿)
writeQueueSize: 2048

# ---- 视频源: 读 rkipc 的 RTSP ----
paths:
  car:
    source: rtsp://127.0.0.1:554/live/0
    # 低延迟优先: 不等完整 GOP, 来一帧发一帧
    sourceOnDemand: no
    # 走 TCP 而不是 UDP: 本机回环上 TCP 更稳, 且 SPI 隧道只转发 TCP
    rtspTransport: tcp

# ---- WebRTC: 唯一的实时视频出口 ----
webrtc: yes
webrtcAddress: :8889

# ---- 本地控制 API (单客户端接管要用) ----
# web_server.py 的后台线程每秒问一次 /v3/webrtcsessions/list, 把不属于当前
# 所有者的 WebRTC 会话踢掉 —— 那是"新浏览器接管后, 旧的必须真的断掉"的
# 兜底层 (防旧页面卡死了自己不会停)。
#
# 绑定 127.0.0.1: 这个 API 没有任何认证, 而板子的 80/8889 是经隧道暴露给
# 局域网的。只给本机用就够了。
api: yes
apiAddress: 127.0.0.1:9997

# ICE candidate 要写成**浏览器能到达的地址**。
# 板子自己看到的是 eth0 的 192.168.3.x, 但浏览器实际连的是 C5 的
# 192.168.3.69 (经 SPI 隧道 + C5 的 NAPT 端口映射转发)。
webrtcAdditionalHosts: [192.168.3.69]

# UDP 媒体候选: 这是**低延迟的关键**, 不要再关掉它。
#
# 这里曾经写着 webrtcLocalUDPAddress: "" 并附一句话"SPI 隧道只转发 TCP"。
# 那句话是错的: C5 固件 spinet.c 里的 FWD_UDP 表一直映射着 8189/udp,
# 只是没人试过。实测 (PC -> 192.168.3.69:8189 发 UDP, 板子上收到并回包)
# 双向都通, 见 docs/LATENCY.md。
#
# 为什么必须开 UDP: 浏览器只拿到 TCP 候选时会走 ICE/TCP, 于是整条图传
# (视频+RTCP+DataChannel) 挤在一条 TCP 流里。隧道上任何一次丢包都会让
# TCP 头阻塞, 而 RTO 最小 200ms (板子上 tcp_rto_min 不存在, RTO 实测
# 就是 200ms) —— 用户看到的"200多毫秒"就是这个数。UDP 没有重传队列,
# 丢一帧只丢一帧, 浏览器的 jitter buffer 因此可以压到 50ms 左右。
webrtcLocalUDPAddress: :8189
# TCP 候选保留作为兜底: 万一 UDP 那条路被(隧道/路由)打断, 还能连上。
webrtcLocalTCPAddress: :8189

# ---- HLS 兜底 (延迟大, 只在 WebRTC 不通时用) ----
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: no

# ---- RTSP 服务 (调试用) ----
rtsp: yes
rtspAddress: :8554
